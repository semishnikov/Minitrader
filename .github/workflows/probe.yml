name: probe
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Информация о раннере
        run: |
          echo "java:"; java -version 2>&1 | head -2
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head
          echo "build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null
